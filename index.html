 {slug:'ifrs16-arenda',rubric:'articles',date:'2026-10-22',author:1,
  title:{ru:'МСФО (IFRS) 16: что проверить в договорах аренды до закрытия года',uz:'MHXS (IFRS) 16: yil yopilishidan oldin ijara shartnomalarida nimani tekshirish kerak',en:'IFRS 16: what to check in your lease contracts before year-end'},
  excerpt:{ru:'Пять вопросов, которые помогут не упустить аренду, скрытую в договорах услуг, и правильно оценить срок аренды.',uz:'Xizmat shartnomalarida yashiringan ijarani o‘tkazib yubormaslik va ijara muddatini to‘g‘ri baholashga yordam beradigan beshta savol.',en:'Five questions that help you spot leases hidden in service contracts and assess the lease term correctly.'},
  body:{ru:['Перед годовым закрытием стоит заново пройти по всем договорам, где компания получает право использовать конкретный актив: склад, транспорт, оборудование, серверные мощности. Часть из них оформлена как услуги, но по существу содержит аренду.','Ключевые вопросы: идентифицирован ли актив, получает ли компания практически все экономические выгоды от его использования и кто определяет, как и для чего актив используется. Если ответы указывают на компанию, договор нужно оценить как аренду.','Отдельное внимание — сроку аренды. Опционы на продление учитываются, если их исполнение достаточно определено, и именно здесь чаще всего возникают расхождения с аудитором.'],
   uz:['Yillik yopilishdan oldin kompaniya muayyan aktivdan foydalanish huquqini oladigan barcha shartnomalarni qayta ko‘rib chiqish lozim: ombor, transport, uskunalar, server quvvatlari. Ularning bir qismi xizmat sifatida rasmiylashtirilgan, ammo mohiyatan ijarani o‘z ichiga oladi.','Asosiy savollar: aktiv aniqlanganmi, kompaniya undan foydalanishning deyarli barcha iqtisodiy naflarini oladimi va aktivdan qanday va nima maqsadda foydalanishni kim belgilaydi. Agar javoblar kompaniyaga ishora qilsa, shartnoma ijara sifatida baholanishi kerak.','Ijara muddatiga alohida e’tibor bering. Uzaytirish opsionlari ularni amalga oshirish yetarlicha aniq bo‘lsa hisobga olinadi va auditor bilan kelishmovchiliklar ko‘pincha aynan shu yerda yuzaga keladi.'],
   en:['Before year-end close, review every contract that gives the company the right to use a specific asset: warehouses, vehicles, equipment, server capacity. Some of them are documented as services but in substance contain a lease.','The key questions: is the asset identified, does the company obtain substantially all the economic benefits from its use, and who directs how and for what purpose the asset is used. If the answers point to the company, the contract must be assessed as a lease.','Pay particular attention to the lease term. Extension options are included when their exercise is reasonably certain, and this is where differences with the auditor most often arise.']}},
 {slug:'zakon-obzor-2027',rubric:'law',date:'2026-10-15',author:null,doc:{ru:'[Вид, номер и дата документа]',uz:'[Hujjat turi, raqami va sanasi]',en:'[Document type, number and date]'},source:'lex.uz',
  title:{ru:'Обзор изменений налогового законодательства на 2027 год',uz:'2027-yil uchun soliq qonunchiligidagi o‘zgarishlar sharhi',en:'Overview of tax law changes for 2027'},
  excerpt:{ru:'Что меняется, с какой даты действует и каких компаний касается: краткий разбор с ссылкой на первоисточник.',uz:'Nima o‘zgaradi, qachondan kuchga kiradi va qaysi kompaniyalarga taalluqli: birlamchi manbaga havola bilan qisqa tahlil.',en:'What changes, when it takes effect and which companies it affects: a short summary linked to the original source.'},
  body:{ru:['В рубрике «Нормативно-правовая база» каждый материал строится одинаково: что изменилось, с какой даты действует, кого касается и что сделать уже сейчас.','В конце материала — реквизиты документа и ссылка на официальный текст на lex.uz.'],
   uz:['«Me’yoriy-huquqiy baza» ruknidagi har bir material bir xil tuziladi: nima o‘zgardi, qachondan kuchga kiradi, kimga taalluqli va hozirning o‘zida nima qilish kerak.','Material oxirida hujjat rekvizitlari va lex.uz saytidagi rasmiy matnga havola beriladi.'],
   en:['Every item in the Legal framework section follows the same structure: what has changed, when it takes effect, who it affects and what to do now.','Each item ends with the document details and a link to the official text on lex.uz.']}},
 {slug:'obuchenie-pod-zapros',rubric:'news',date:'2026-10-08',author:null,
  title:{ru:'HASBA AUDIT проводит корпоративное и персональное обучение',uz:'HASBA AUDIT korporativ va shaxsiy ta’lim o‘tkazadi',en:'HASBA AUDIT now offers in-house and one-to-one training'},
  excerpt:{ru:'Программу собираем под запрос: МСФО, налоги, внутренний контроль, закрытие периода. Обсудить обучение можно по телефону.',uz:'Dasturni so‘rov asosida tuzamiz: MHXS, soliqlar, ichki nazorat, davrni yopish. Ta’limni telefon orqali muhokama qilish mumkin.',en:'Each programme is built on request: IFRS, tax, internal control, period-end close. Call us to discuss your training.'},
  body:{ru:['Обучение проводят практикующие аудиторы и налоговые консультанты HASBA AUDIT. Для команды компании программа строится вокруг задач финансовой службы, персональные занятия — вокруг вопросов конкретного специалиста.','Формат, сроки и место согласуем после звонка.'],
   uz:['Ta’limni HASBA AUDITning amaliyotchi auditorlari va soliq maslahatchilari olib boradi. Kompaniya jamoasi uchun dastur moliya xizmati vazifalari atrofida, shaxsiy mashg‘ulotlar esa muayyan mutaxassisning savollari atrofida quriladi.','Format, muddat va joy qo‘ng‘iroqdan so‘ng kelishiladi.'],
   en:['Training is delivered by HASBA AUDIT’s practising auditors and tax consultants. In-house programmes are built around the finance team’s tasks; one-to-one sessions around the specialist’s own questions.','Format, timing and venue are agreed after your call.']}},

 {slug:'intervyu-direktor',rubric:'interviews',date:'2026-09-30',author:0,
  title:{ru:'Интервью с директором HASBA AUDIT о первых месяцах работы',uz:'HASBA AUDIT direktori bilan dastlabki ish oylari haqida intervyu',en:'Interview with the HASBA AUDIT director on the first months of work'},
  excerpt:{ru:'О том, с какими задачами приходят клиенты и почему компании всё чаще заказывают аудит по собственной инициативе.',uz:'Mijozlar qanday vazifalar bilan kelishi va nega kompaniyalar o‘z tashabbusi bilan auditga tobora ko‘proq murojaat qilishi haqida.',en:'On the challenges clients bring and why companies increasingly commission audits on their own initiative.'},
  body:{ru:['Здесь будет текст интервью в формате «вопрос — ответ». Для интервью стоит подготовить 5–7 вопросов и портретное фото собеседника.'],

 {slug:'vnutrenniy-kontrol',rubric:'articles',date:'2026-09-25',author:3,
  title:{ru:'Внутренний контроль в небольшой финансовой службе: с чего начать',uz:'Kichik moliya xizmatida ichki nazorat: nimadan boshlash kerak',en:'Internal control in a small finance team: where to start'},
  excerpt:{ru:'Три контрольные процедуры, которые снижают риск ошибок без расширения штата.',uz:'Xodimlar sonini oshirmasdan xatolar xavfini kamaytiradigan uchta nazorat tartibi.',en:'Three control procedures that reduce the risk of error without adding headcount.'},
  body:{ru:['Даже в службе из трёх человек можно выстроить базовый контроль. Первое — разделить подготовку и утверждение платежей. Второе — ежемесячно сверять расчёты с крупнейшими контрагентами. Третье — закрывать период по единому чек-листу.','Эти процедуры не требуют новых систем и окупаются уже на первой проверке.'],
   uz:['Uch kishilik xizmatda ham asosiy nazoratni yo‘lga qo‘yish mumkin. Birinchisi — to‘lovlarni tayyorlash va tasdiqlashni ajratish. Ikkinchisi — yirik kontragentlar bilan hisob-kitoblarni har oy solishtirish. Uchinchisi — davrni yagona nazorat ro‘yxati bo‘yicha yopish.','Bu tartiblar yangi tizimlarni talab qilmaydi va birinchi tekshiruvdayoq o‘zini oqlaydi.'],
   en:['Even a team of three can put basic controls in place. First, separate preparing payments from approving them. Second, reconcile balances with your largest counterparties every month. Third, close each period against a single checklist.','None of this requires new systems, and it pays off at the very first audit.']}},

  excerpt:{ru:'Специалисты HASBA AUDIT рассказали студентам о профессии аудитора и разобрали практические задачи.',uz:'HASBA AUDIT mutaxassislari talabalarga auditor kasbi haqida so‘zlab berdi va amaliy masalalarni tahlil qildi.',en:'HASBA AUDIT specialists talked to students about the audit profession and worked through practical cases.'},
  body:{ru:['Здесь будет рассказ о мероприятии: где проходило, сколько было участников, что обсуждали. Хорошо работают 3–6 фотографий.'],uz:['Bu yerda tadbir haqida hikoya bo‘ladi: qayerda o‘tdi, nechta ishtirokchi bo‘ldi, nimalar muhokama qilindi. 3–6 ta surat yaxshi ishlaydi.'],en:['This is where the event story goes: where it took place, how many attended and what was discussed. Three to six photos work well.']}},
 {slug:'nds-zachet-oshibki',rubric:'articles',date:'2026-10-05',author:2,
  title:{ru:'Зачёт НДС: пять ошибок, которые чаще всего находят при проверке',uz:'QQSni hisobga olish: tekshiruvda eng ko‘p aniqlanadigan beshta xato',en:'VAT recovery: five errors most often found in tax audits'},
  excerpt:{ru:'От счетов-фактур с неверными реквизитами до НДС по расходам, не связанным с облагаемой деятельностью.',uz:'Rekvizitlari noto‘g‘ri hisobvaraq-fakturalardan tortib soliq solinadigan faoliyatga aloqador bo‘lmagan xarajatlar bo‘yicha QQSgacha.',en:'From invoices with incorrect details to VAT on costs unrelated to taxable activity.'},
  body:{ru:['Большинство претензий по НДС связаны не со сложными схемами, а с документами: неверные реквизиты в электронных счетах-фактурах, отсутствие подтверждения поставки, зачёт по расходам, которые не относятся к облагаемым операциям.','Проще всего снизить риск регулярной сверкой входящих счетов-фактур с данными учёта до подачи декларации.'],
   uz:['QQS bo‘yicha da’volarning aksariyati murakkab sxemalar bilan emas, balki hujjatlar bilan bog‘liq: elektron hisobvaraq-fakturalardagi noto‘g‘ri rekvizitlar, yetkazib berishni tasdiqlovchi hujjat yo‘qligi, soliq solinadigan operatsiyalarga taalluqli bo‘lmagan xarajatlar bo‘yicha hisobga olish.','Xavfni kamaytirishning eng oson yo‘li — deklaratsiya topshirishdan oldin kiruvchi hisobvaraq-fakturalarni hisob ma’lumotlari bilan muntazam solishtirish.'],
   en:['Most VAT disputes stem not from complex schemes but from paperwork: incorrect details on electronic invoices, missing proof of delivery, and recovery on costs unrelated to taxable supplies.','The simplest way to reduce the risk is to reconcile incoming invoices with your accounting records before filing the return.']}},

MCX.esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
MCX.arrow='<span class="arrow" aria-hidden="true">↗</span>';
MCX.HOME='p-home-v2';
MCX.author=(t,i)=>i==null?'HASBA AUDIT':t.team[i][1];
MCX.sorted=()=>MCX.items.slice().sort((a,b)=>b.date.localeCompare(a.date));
MCX.tag=u=>`<span class="mc-sample">${u.sample}</span>`;
/* Шапка: пункты «Обучение» и «Медиацентр»; на внутренних страницах ссылки ведут на новую главную */
MCX.nav=(t,lang,onHome)=>{const u=MCX.ui[lang];
 document.querySelectorAll('.nav,.nav-mobile').forEach(nav=>{
  const links=[...nav.querySelectorAll('a')];const contact=links[links.length-1];
  const tr=document.createElement('a');tr.textContent=u.navTraining;
  const md=document.createElement('a');md.textContent=u.navMedia;
  if(onHome){tr.href='#training'}else{tr.href='#';tr.dataset.go=MCX.HOME;tr.dataset.anchor='training'}
  md.href='#';md.dataset.go='p-media';md.dataset.rubricGo='all';
  nav.insertBefore(tr,contact);nav.insertBefore(md,contact);
  if(!onHome)links.forEach(a=>{const id=a.getAttribute('href').slice(1);a.href='#';a.dataset.go=MCX.HOME;a.dataset.anchor=id});
 });
 document.querySelectorAll('.header a[aria-label],.footer-top a[aria-label]').forEach(a=>{a.href='#';a.dataset.go=MCX.HOME});
 /* Подвал: три колонки ссылок — компания, обучение, медиацентр */
 const ft=document.querySelector('.footer .footer-top');
 if(ft&&!document.querySelector('.footer-nav')){
  const homeLink=(label,id)=>onHome?`<a href="#${id}">${label}</a>`:`<a href="#" data-go="${MCX.HOME}" data-anchor="${id}">${label}</a>`;
  const ids=['services','about','approach','contact'];
  const col=(title,links,go,extra='')=>`<div><h3>${go?`<a href="#" data-go="${go}"${extra}>${title}</a>`:title}</h3><ul>${links.map(l=>`<li>${l}</li>`).join('')}</ul></div>`;
  ft.insertAdjacentHTML('afterend',`<nav class="footer-nav" aria-label="${u.company}">`
   +col(u.company,t.nav.map((n,i)=>homeLink(n,ids[i])))
   +col(u.navTraining,[u.offer[0][0],u.offer[1][0]].map(l=>homeLink(l,'training')).concat(`<a href="${MCX.phone.href}">${MCX.phone.label}</a>`))
   +col(u.navMedia,Object.keys(MCX.rubrics).map(k=>`<a href="#" data-go="p-media" data-rubric-go="${k}">${MCX.rubrics[k][lang]}</a>`),'p-media',' data-rubric-go="all"')
   +`</nav>`);
 }
 document.querySelectorAll('[data-rubric-go]').forEach(a=>{if(a.dataset.rb)return;a.dataset.rb='1';a.addEventListener('click',()=>{DRAFT.state.rubric=a.dataset.rubricGo;DRAFT.state.shown=0})});
};
MCX.markNav=id=>document.querySelectorAll(`.nav [data-go="${id}"],.nav-mobile [data-go="${id}"]`).forEach(a=>a.setAttribute('aria-current','page'));
MCX.crumbs=(parts)=>`<nav class="mc-crumbs" aria-label="breadcrumb">${parts.map(([label,go])=>go?`<a href="#" data-go="${go}">${label}</a>`:`<span aria-current="page">${label}</span>`).join('<span aria-hidden="true">/</span>')}</nav>`;
MCX.contact=t=>`<section class="contact" id="contact"><div class="wrap contact-grid contact-call"><h2>${t.contactTitle}</h2><div class="contact-links"><a class="contact-number" href="tel:+998913653555">+998 91 365 35 55</a><a class="contact-number" href="tel:+998703225555">+998 70 322 55 55</a><a class="contact-number contact-email" href="mailto:info@hasba.uz">info@hasba.uz</a></div></div></section>`;

/* Карточка материала */
MCX.card=(it,t,lang)=>{const u=MCX.ui[lang];return `<a class="mc-card" href="#" data-go="p-m-${it.slug}"><span class="mc-meta"><span>${MCX.rubrics[it.rubric][lang]}</span><time datetime="${it.date}">${MCX.date(it.date,lang)}</time></span><h3>${it.title[lang]}</h3><p>${it.excerpt[lang]}</p><span class="mc-more">${u.read} ${MCX.arrow}</span></a>`};
/* Строка материала в ленте */
MCX.row=(it,t,lang)=>`<a class="mc-row" href="#" data-go="p-m-${it.slug}" data-rubric="${it.rubric}"><time datetime="${it.date}">${MCX.date(it.date,lang)}</time><span class="mc-row-rubric">${MCX.rubrics[it.rubric][lang]}</span><span class="mc-row-text"><strong>${it.title[lang]}</strong><span>${it.excerpt[lang]}</span></span><span class="service-go" aria-hidden="true">↗</span></a>`;

/* Ближайший тренинг — карточка */

MCX.offer=(t,lang)=>{const u=MCX.ui[lang];return `<div class="tr-offer" id="offer"><div class="tr-offer-head"><p class="tr-offer-label">${u.offerLabel}</p><h3>${u.offerTitle.replace(/<br>/g,' ')}</h3></div><div class="tr-offer-cols">${u.offer.map(o=>`<div><h4>${o[0]}</h4><p>${o[1]}</p></div>`).join('')}</div><div class="tr-offer-cta"><a class="button" href="${MCX.phone.href}">${u.callShort}: <span style="white-space:nowrap">${MCX.phone.label}</span> ${MCX.arrow}</a><p>${u.callNote}</p></div></div>`};

MCX.css=`
/* Сетка: --meta — левая служебная колонка (дата, рубрика), --gut — межколонник. Заголовки лент, статей и карточек тренингов стоят на одной вертикали: край + --meta + --gut */
:root{--meta:375px;--gut:25px}
@media(max-width:1100px){:root{--meta:130px}}
.mc-count{margin-left:7px;font-size:12px;color:var(--muted)}.mc-chip[aria-pressed=true] .mc-count{color:inherit;opacity:.7}
.mc-loadmore{display:flex;justify-content:center;padding-top:32px}

.footer-nav{display:grid;grid-template-columns:var(--meta) minmax(0,1fr) minmax(0,1.6fr);gap:40px var(--gut);margin-top:40px;padding-top:32px;border-top:1px solid #333}
.footer-nav h3{font-size:14px;font-weight:600;margin-bottom:16px}.footer-nav h3 a:hover{color:#d9a3a3}
.footer-nav ul{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:14px;color:#aaa}
.footer-nav li a:hover{color:#fff}
.footer-nav>div:last-child ul{grid-template-columns:1fr 1fr;column-gap:28px}
@media(max-width:900px){.footer-nav{grid-template-columns:1fr 1fr}.footer-nav>div:last-child{grid-column:1/-1}}
@media(max-width:560px){.footer-nav{grid-template-columns:1fr;gap:28px}.footer-nav>div:last-child ul{grid-template-columns:1fr}}

.nav a[aria-current=page],.nav-mobile a[aria-current=page]{color:var(--wine)}
.mc-sample{display:inline-block;font-size:12px;line-height:1;padding:5px 8px;border:1px dashed currentColor;color:var(--muted);font-weight:500;vertical-align:middle}

.tr-offer-label{font-size:14px;color:#ffffffa8;margin-bottom:16px}

.mc-row time{font-size:14px;color:var(--muted);padding-top:4px}
.mc-row-rubric{font-size:14px;color:var(--wine);padding-top:4px}
.mc-row-text strong{display:block;font-size:22px;line-height:1.3;font-weight:500}
.mc-row-text span{display:block;color:var(--muted);margin-top:8px;max-width:640px}
.mc-row:hover .service-go{background:var(--wine);color:#fff;border-color:var(--wine)}
.mc-row:hover strong{color:var(--wine)}
.mc-empty{padding:40px 0;color:var(--muted);border-top:1px solid var(--line)}
.mc-section{padding-block:85px}
/* ----- Статья ----- */
.mc-article{display:grid;grid-template-columns:var(--meta) minmax(0,1fr);gap:0 var(--gut);margin-top:48px;padding:40px 0 85px;border-top:1px solid #000}
.mc-aside{display:flex;flex-direction:column;align-items:flex-start;gap:6px;font-size:14px;color:var(--muted)}
.mc-aside>a{color:var(--wine)}.mc-aside .mc-sample{margin-top:6px}
.mc-main{min-width:0}
.mc-article h1{font-size:clamp(34px,4.4vw,60px);line-height:1.08;letter-spacing:-.03em;font-weight:500;max-width:900px}
.mc-article .mc-standfirst{font-size:21px;line-height:1.5;margin-top:26px;max-width:680px}
.mc-byline{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:2px;width:100%;max-width:240px}
.mc-byline strong{font-weight:500;font-size:15px;color:var(--black)}
.mc-body{margin-top:34px;max-width:680px}
.mc-body p{font-size:18px;line-height:1.7}
.mc-body p+p{margin-top:20px}
.mc-doc{margin-top:34px;max-width:680px;padding:22px 24px;background:#f4f4f4;border-left:2px solid var(--wine);display:grid;gap:8px;font-size:15px}
.mc-doc span{color:var(--muted)}
.mc-note{margin-top:34px;max-width:680px;font-size:14px;color:var(--muted);padding:14px 16px;border:1px dashed #bbb}
.mc-back{display:inline-block;margin-top:40px}
/* ----- Страница тренингов ----- */



@media(max-width:1100px){.mc-row{grid-template-columns:130px 1fr 42px}.mc-row-rubric{grid-column:2;grid-row:1}.mc-row-text{grid-column:2}.mc-row .service-go{grid-column:3;grid-row:1}.tr-offer{grid-template-columns:1fr}}
@media(max-width:900px){.mc-cards{grid-template-columns:1fr}.mc-card{min-height:0}}
@media(max-width:760px){.tr-offer{padding:30px 22px;margin-top:48px}.tr-offer-cols{grid-template-columns:1fr;gap:24px}.tr-offer .button{width:100%;gap:12px}.mc-rubrics .button{margin-left:0;width:100%}.mc-hero{grid-template-columns:1fr;gap:20px;padding:30px 0}.mc-filter{flex-wrap:nowrap;overflow-x:auto;margin-inline:-22px;padding:20px 22px;scrollbar-width:none}.mc-lead{grid-template-columns:1fr;gap:16px;padding:28px 0 36px}.mc-row{grid-template-columns:1fr 34px;gap:8px 12px;padding:22px 0}.mc-row time{grid-column:1;grid-row:1;padding:0}.mc-row-rubric{grid-column:1;grid-row:2;padding:0}.mc-row-text{grid-column:1/-1;grid-row:3;margin-top:6px}.mc-row-text strong{font-size:20px}.mc-row .service-go{grid-column:2;grid-row:1/3;width:34px;height:34px}.mc-article .mc-standfirst{font-size:19px}.mc-body p{font-size:17px}.mc-section{padding-block:55px}.mc-article{grid-template-columns:1fr;gap:24px;padding:28px 0 55px}.mc-byline{max-width:none}}

.tr-section .tr-offer{margin-top:0}
`;

/* ===== Концепт 1: новая главная с разделами «Обучение» и «Медиацентр» ===== */
DRAFT.add({id:MCX.HOME,title:'Главная v2: Обучение и Медиацентр',note:'Два новых раздела на главной перед контактами и пункты в меню.',status:'concept',css:MCX.css,
 after(t,lang){const u=MCX.ui[lang];MCX.nav(t,lang,true);
  const latest=MCX.sorted().slice(0,3);
  const html=`<section class="section wrap tr-section" id="training">${MCX.offer(t,lang)}</section>
   <section class="section mc-home" id="media"><div class="wrap"><div class="section-top"><div class="section-label"><span>07</span>${u.mediaLabel}</div><div><h2>${u.mediaTitle}</h2><p class="section-intro">${u.mediaIntro}</p></div></div>
   <div class="mc-cards">${latest.map(it=>MCX.card(it,t,lang)).join('')}</div>
   <div class="mc-rubrics">${Object.keys(MCX.rubrics).map(k=>`<a class="mc-chip" href="#" data-go="p-media" data-rubric-go="${k}">${MCX.rubrics[k][lang]}</a>`).join('')}<a class="button" href="#" data-go="p-media" data-rubric-go="all">${u.allMaterials} ${MCX.arrow}</a></div></div></section>`;
  document.getElementById('contact').insertAdjacentHTML('beforebegin',html);
  document.querySelectorAll('[data-rubric-go]').forEach(a=>a.addEventListener('click',()=>{DRAFT.state.rubric=a.dataset.rubricGo;DRAFT.state.shown=0},true));
 }});

/* ===== Концепт 2: страница «Медиацентр» ===== */
DRAFT.add({id:'p-media',title:'Медиацентр',note:'Лента материалов с фильтром по 7 рубрикам, страница статьи.',status:'concept',css:MCX.css,
 render(t,lang){const u=MCX.ui[lang];const all=MCX.sorted();
  return `<div class="wrap mc-page">${MCX.crumbs([[u.home,MCX.HOME],[u.mediaLabel]])}
   <div class="mc-hero"><h1>${u.mediaLabel}</h1><p>${u.mediaIntro}</p></div>
   <div class="mc-filter" role="group" aria-label="${u.mediaLabel}"><button type="button" class="mc-chip" data-rubric="all">${u.all}<span class="mc-count">${MCX.items.length}</span></button>${Object.keys(MCX.rubrics).map(k=>`<button type="button" class="mc-chip" data-rubric="${k}">${MCX.rubrics[k][lang]}<span class="mc-count">${MCX.items.filter(i=>i.rubric===k).length}</span></button>`).join('')}</div>
   <div class="mc-feed"></div></div><div class="mc-section"></div>${MCX.contact(t)}`},
 after(t,lang){const u=MCX.ui[lang];MCX.nav(t,lang,false);MCX.markNav('p-media');
  const feed=document.querySelector('.mc-feed');
  const PER=8;const draw=()=>{const r=DRAFT.state.rubric||'all';const shown=DRAFT.state.shown||PER;const list=MCX.sorted().filter(i=>r==='all'||i.rubric===r);
   document.querySelectorAll('.mc-filter [data-rubric]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.rubric===r)));
   if(!list.length){feed.innerHTML=`<p class="mc-empty">${u.empty}</p>`;return}
   const [first,...rest]=list;
   feed.innerHTML=`<article class="mc-lead"><div class="mc-meta"><span>${MCX.rubrics[first.rubric][lang]}</span><time datetime="${first.date}">${MCX.date(first.date,lang)}</time><span>${MCX.tag(u)}</span></div><div><h2><a href="#" data-go="p-m-${first.slug}">${first.title[lang]}</a></h2><p>${first.excerpt[lang]}</p><a class="text-link" href="#" data-go="p-m-${first.slug}">${u.read}</a></div></article>${rest.length?`<div class="mc-list">${rest.slice(0,shown).map(i=>MCX.row(i,t,lang)).join('')}</div>`:''}${rest.length>shown?`<div class="mc-loadmore"><button type="button" class="mc-chip">${u.more} <span class="mc-count">${rest.length-shown}</span></button></div>`:''}`;
   const more=feed.querySelector('.mc-loadmore button');if(more)more.addEventListener('click',()=>{DRAFT.state.shown=shown+PER;draw();const rows=feed.querySelectorAll('.mc-row');const f=rows[shown];f&&f.focus()});};
  document.querySelectorAll('.mc-filter [data-rubric]').forEach(b=>b.addEventListener('click',()=>{DRAFT.state.rubric=b.dataset.rubric;DRAFT.state.shown=PER;draw()}));
  draw();
 }});

/* ===== Страницы материалов (скрыты из списка, открываются из ленты) ===== */
MCX.items.forEach(it=>DRAFT.add({id:'p-m-'+it.slug,hidden:true,title:it.title.ru,status:'concept',css:MCX.css,
 render(t,lang){const u=MCX.ui[lang];const rel=MCX.sorted().filter(x=>x!==it).sort((a,b)=>(b.rubric===it.rubric)-(a.rubric===it.rubric)).slice(0,3);
  return `<div class="wrap mc-page">${MCX.crumbs([[u.home,MCX.HOME],[u.mediaLabel,'p-media'],[MCX.rubrics[it.rubric][lang]]])}<article class="mc-article">
   <aside class="mc-aside"><a href="#" data-go="p-media" data-rubric-go="${it.rubric}">${MCX.rubrics[it.rubric][lang]}</a><time datetime="${it.date}">${MCX.date(it.date,lang)}</time>${MCX.tag(u)}
   <p class="mc-byline"><span>${u.author}</span><strong>${MCX.author(t,it.author)}</strong>${it.author!=null?`<span>${t.team[it.author][2]}</span>`:''}</p></aside>
   <div class="mc-main"><h1>${it.title[lang]}</h1><p class="mc-standfirst">${it.excerpt[lang]}</p>
   <div class="mc-body">${it.body[lang].map(p=>`<p>${p}</p>`).join('')}</div>
   ${it.doc?`<div class="mc-doc"><div><span>${u.document}:</span> ${it.doc[lang]}</div><div><span>${u.source}:</span> ${it.source}</div></div>`:''}
   <p class="mc-note">${u.sampleNote}</p><a class="text-link mc-back" href="#" data-go="p-media">${u.back}</a></div></article></div>
   <section class="section mc-home"><div class="wrap"><div class="section-top"><div class="section-label">${u.mediaLabel}</div><h2>${u.related}</h2></div><div class="mc-cards">${rel.map(x=>MCX.card(x,t,lang)).join('')}</div></div></section>${MCX.contact(t)}`},
 after(t,lang){MCX.nav(t,lang,false);MCX.markNav('p-media');document.title=it.title[lang]+' · Черновик HASBA';
  document.querySelectorAll('[data-rubric-go]').forEach(a=>a.addEventListener('click',()=>{DRAFT.state.rubric=a.dataset.rubricGo;DRAFT.state.shown=0},true));}}));

</script>
<script id="draft-post">
/* ===== Оболочка черновика (после сайта): переключение страниц ===== */
(function(){
 const A=window.HASBA_ASSETS||{};
 const HOME={id:'p-home',title:'Главная — как на hasba.uz',note:'Текущая версия сайта. Это точка отсчёта для концептов.',status:'live'};

 let current=HOME.id;
 const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

 function fixAssets(root){root.querySelectorAll('img[src^="./assets/"],source[srcset^="./assets/"]').forEach(el=>{const attr=el.hasAttribute('src')?'src':'srcset';const k=el.getAttribute(attr).slice(2);if(A[k])el.setAttribute(attr,A[k]);});}
 function applyView(){

 }
 const siteRender=render;

 const tags={live:['На сайте','live'],concept:['Концепт',''],ready:['Готов к релизу','ready']};
 const ui=document.createElement('div');ui.className='dr';
 ui.innerHTML='<div class="dr-panel" id="dr-panel" role="dialog" aria-label="Страницы черновика" hidden></div><button type="button" class="dr-pill" aria-controls="dr-panel" aria-expanded="false"><span class="dr-dot"></span><b>Черновик</b><span></span></button>';
 document.body.appendChild(ui);
 const panel=ui.querySelector('.dr-panel'),pill=ui.querySelector('.dr-pill');
 const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 function renderPanel(){

  panel.innerHTML=`<h2>Черновик сайта hasba.uz</h2><p class="dr-sub">Не опубликован на hasba.uz. Здесь собираем концепты страниц, а утверждённые выпускаем в релиз на ahost.</p><ul class="dr-list">${items}</ul>${DRAFT.pages.filter(x=>!x.hidden).length?'':'<p class="dr-empty">Концептов пока нет. Опишите в чате с Claude, какую страницу или блок нарисовать, и он появится здесь отдельным пунктом.</p>'}<p class="dr-foot">Ссылка на конкретную страницу: адрес черновика + #id страницы. Язык переключается в шапке сайта и сохраняется.</p>`;
  panel.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{go(b.dataset.page);toggle(false);pill.focus()}));

 function toggle(open){if(open)renderPanel();panel.hidden=!open;pill.setAttribute('aria-expanded',String(open));if(open){const c=panel.querySelector('[aria-current]');c&&c.focus()}}
 pill.addEventListener('click',()=>toggle(panel.hidden));

 function go(id,anchor){if(!pages().some(x=>x.id===id))id=HOME.id;current=id;store.set('dr-page',id);try{history.replaceState(null,'','#'+id)}catch(e){}siteRender(lang,true);applyView();
